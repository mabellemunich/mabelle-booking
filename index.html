        /* --- MICRO-ANIMATIONEN --- */
        @keyframes springBounce {
            0% { transform: scale(0.9); opacity: 0; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-spring {

        @keyframes slideFade {

        };

        // Das SVG-Icon der Tasse mit einem edlen, dunklen Hintergrund für das App-Logo
        const svgIconRaw = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-4 -4 32 32">
            <rect x="-4" y="-4" width="32" height="32" fill="#1c1917" />
            <g fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
                <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
                <line x1="6" x2="6" y1="2" y2="4"/>
                <line x1="10" x2="10" y1="2" y2="4"/>
                <line x1="14" x2="14" y1="2" y2="4"/>
            </g>
        </svg>`;
        
        const iconDataUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIconRaw);
        
        // Wir wandeln das SVG für Apple/Android automatisch in ein echtes PNG-Bild um!
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 512, 512);
            
            // iOS & Android lieben echte PNGs als App-Icon
            const pngUrl = canvas.toDataURL('image/png'); 
            
            document.getElementById('apple-touch-icon').setAttribute('href', pngUrl);
            
            const manifest = {
                name: "MABELLE Booking", short_name: "MABELLE", display: "standalone", background_color: "#1c1917", theme_color: "#d97706", start_url: window.location.href,
                icons: [{ src: pngUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
            };
            const manifestUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            document.getElementById('manifest-link').setAttribute('href', manifestUrl);
        };
        img.src = iconDataUrl;

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => {});`;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log("SW Reg Error:", err));
        }
    </script>

            const bytes = new Uint8Array(buffer);
            let str = '';
            for (let charCode of bytes) str += String.fromCharCode(charCode);
            return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        };

            const padding = '='.repeat((4 - base64url.length % 4) % 4);

            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);

        // --- MAP RENDERER ---
        const MapRenderer = ({ tables, onTableClick, selectedTableId, isEditor, onDragMove, onDragEnd }) => {
            const containerRef = useRef(null);
            const [scale, setScale] = useState(1);
            const [isDragging, setIsDragging] = useState(false);
            const dragItem = useRef(null);

            useLayoutEffect(() => {
                const handleResize = () => {
                    if (containerRef.current) {
                        const { width } = containerRef.current.getBoundingClientRect();
                        const newScale = width / 1000; 
                        setScale(newScale);
                    }
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const handleMouseDown = (e, id) => {
                if (!isEditor) { if (onTableClick) onTableClick(e, id); return; }
                e.preventDefault(); setIsDragging(true); dragItem.current = id;
                if (onTableClick) onTableClick(e, id);
            };

            const handleMouseMove = (e) => {
                if (!isDragging || !dragItem.current || !containerRef.current) return;
                e.preventDefault();
                const rect = containerRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let x = ((clientX - rect.left) / rect.width) * 100;
                let y = ((clientY - rect.top) / rect.height) * 100;
                x = Math.max(0, Math.min(100, x)); y = Math.max(0, Math.min(100, y));
                if (onDragMove) onDragMove(dragItem.current, x, y);
            };

            const handleMouseUp = () => { setIsDragging(false); dragItem.current = null; if (onDragEnd) onDragEnd(); };
            
            const containerHeight = scale * 800;

            return (
                <div ref={containerRef} className="relative w-full overflow-hidden bg-stone-100 dark:bg-stone-900 grid-bg rounded-lg" style={{ height: `${Math.max(400, containerHeight)}px` }} 
                    onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onTouchMove={handleMouseMove} onTouchEnd={handleMouseUp}
                >
                    <div style={{ width: '1000px', height: '800px', transform: `scale(${scale})`, transformOrigin: 'top left', position: 'absolute', top: 0, left: 0 }}>
                        {tables.map(table => (
                            <div key={table.id} onMouseDown={(e) => handleMouseDown(e, table.id)} onTouchStart={(e) => handleMouseDown(e, table.id)}
                                style={{ 
                                    left: `${table.x}%`, top: `${table.y}%`, width: `${table.w}px`, height: `${table.h}px`,
                                    borderRadius: table.subtype === 'round' ? '50%' : '4px',
                                    transform: `translate(-50%, -50%) rotate(${table.rotation || 0}deg)`,
                                    zIndex: selectedTableId === table.id ? 50 : (table.type === 'area' ? 1 : 10),
                                    backgroundColor: table.type === 'window' ? '#38bdf8' : (table.type === 'wall' ? '#78716c' : (table.type === 'area' ? 'rgba(150,150,150,0.2)' : '')),
                                    borderStyle: table.type === 'area' ? 'dashed' : 'solid'
                                }}
                                className={`absolute flex flex-col items-center justify-center text-xs font-bold select-none transition-shadow
                                    ${isEditor ? 'cursor-move' : 'cursor-pointer'} ${table.type === 'table' ? 'border-2 shadow-sm' : ''}
                                    ${table.type === 'table' && selectedTableId === table.id ? 'bg-amber-500 border-amber-300 text-white ring-4 ring-amber-200/50' : ''}
                                    ${table.type === 'table' && selectedTableId !== table.id ? 'bg-white dark:bg-stone-700 border-stone-300 dark:border-stone-500 text-stone-700 dark:text-stone-200' : ''}
                                    ${table.type === 'door' ? '' : ''}`}
                            >
                                {table.type === 'door' ? (
                                    <div className="w-full h-full relative">
                                        <div className="absolute bottom-0 left-0 w-[10%] h-full bg-stone-800 dark:bg-stone-400"></div><div className="absolute bottom-0 right-0 w-[10%] h-full bg-stone-800 dark:bg-stone-400"></div><div className="absolute bottom-0 left-[10%] w-[40%] h-full border-t-2 border-l-2 border-stone-800 dark:border-stone-400 rounded-tl-[100%] opacity-60 origin-bottom-right"></div><div className="absolute bottom-0 left-[10%] w-[40%] h-1 bg-stone-800 dark:bg-stone-400 origin-bottom-left transform -rotate-45"></div><div className="absolute bottom-0 right-[10%] w-[40%] h-full border-t-2 border-r-2 border-stone-800 dark:border-stone-400 rounded-tr-[100%] opacity-60 origin-bottom-left"></div><div className="absolute bottom-0 right-[10%] w-[40%] h-1 bg-stone-800 dark:bg-stone-400 origin-bottom-right transform rotate-45"></div>
                                    </div>
                                ) : (
                                    <><span className={`pointer-events-none ${table.w < 40 ? 'text-[8px]' : 'text-xs'}`}>{table.label}</span>{table.seats > 0 && <span className="text-[9px] opacity-70 font-normal pointer-events-none">{table.seats}P</span>}</>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- CUSTOM CALENDAR ---
        const CustomCalendar = ({ currentDate, onDateSelect, onClose, reservations, theme, isDarkMode }) => {
            const [viewDate, setViewDate] = useState(currentDate);

            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => { let day = new Date(year, month, 1).getDay(); return day === 0 ? 6 : day - 1; };
            const year = viewDate.getFullYear(); const month = viewDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month); const firstDay = getFirstDayOfMonth(year, month);
            
            const reservedDates = useMemo(() => {
                const dates = new Set();
                const threeDaysAgo = new Date();
                threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
                threeDaysAgo.setHours(0, 0, 0, 0);

                (reservations || []).forEach(r => { 
                    if (r && (r.status === 'confirmed' || r.status === 'arrived')) { 
                        const d = new Date(r.date); 
                        d.setHours(0, 0, 0, 0);
                        if (d >= threeDaysAgo) {
                            dates.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); 
                        }
                    } 
                });
                return dates;
            }, [reservations]);
            
            const days = []; for (let i = 0; i < firstDay; i++) days.push(null); for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            const prevMonth = () => setViewDate(new Date(year, month - 1, 1)); const nextMonth = () => setViewDate(new Date(year, month + 1, 1));
            const isSelected = (d) => d && d.getDate() === currentDate.getDate() && d.getMonth() === currentDate.getMonth() && d.getFullYear() === currentDate.getFullYear();
            const hasReservation = (d) => { if (!d) return false; return reservedDates.has(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`); };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className={`rounded-2xl shadow-2xl p-6 w-full max-w-sm animate-spring ${theme.card} border-0`} onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6"><button onClick={prevMonth} className={`p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-700`}><ChevronLeft/></button><h2 className="text-lg font-bold font-mabelle uppercase tracking-widest">{monthNames[month]} {year}</h2><button onClick={nextMonth} className={`p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-700`}><ChevronRight/></button></div>
                        <div className="grid grid-cols-7 mb-2 text-center text-xs font-bold opacity-50"><div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div></div>
                        <div className="grid grid-cols-7 gap-1">{days.map((d, i) => { if (!d) return <div key={i}></div>; const selected = isSelected(d); const reserved = hasReservation(d); return (<button key={i} onClick={() => { onDateSelect(d); onClose(); }} className={`h-10 w-10 mx-auto rounded-full flex items-center justify-center text-sm transition-all ${selected ? 'bg-amber-600 text-white font-bold shadow-lg' : ''} ${!selected && reserved ? 'text-amber-600 font-bold' : ''} ${!selected && !reserved ? (isDarkMode ? 'text-stone-300 hover:bg-stone-700' : 'text-stone-600 hover:bg-stone-100') : ''}`}>{d.getDate()}</button>) })}</div>
                        <div className="mt-6 flex justify-center"><button onClick={onClose} className="text-sm opacity-50 hover:opacity-100">Schließen</button></div>
                    </div>
                </div>
            );
        };

        // --- TABLE EDITOR ---
        const TableEditor = ({ initialLayout, db, theme, isDarkMode }) => {
            const [tables, setTables] = useState(initialLayout || []);
            const [selectedTableId, setSelectedTableId] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const dragItem = useRef(null);
            const [saveStatus, setSaveStatus] = useState(''); 

            useEffect(() => { if (tables.length > 0) localStorage.setItem('mabelle_tables_autosave', JSON.stringify(tables)); }, [tables]);
            useEffect(() => { if (initialLayout && initialLayout.length > 0) { setTables(initialLayout); setSaveStatus('saved'); } else { const saved = localStorage.getItem('mabelle_tables_autosave'); if (saved) { setTables(JSON.parse(saved)); setSaveStatus('local'); } } }, [initialLayout]);

            const addItem = (type, subtype) => {
                const newItem = { id: Date.now(), type, subtype: subtype || null, label: type === 'table' ? `T${tables.filter(t => t.type === 'table').length + 1}` : (subtype === 'bar' ? 'BAR' : (subtype === 'kitchen' ? 'KÜCHE' : '')), seats: type === 'table' ? (subtype === 'round' ? 2 : 4) : 0, x: 50, y: 50, w: 60, h: 60, rotation: 0 };
                if (subtype === 'rect') { newItem.w = 80; newItem.h = 60; } if (type === 'wall') { newItem.w = 100; newItem.h = 4; newItem.label = ''; } if (type === 'window') { newItem.w = 100; newItem.h = 6; newItem.label = ''; } if (type === 'door') { newItem.w = 60; newItem.h = 40; newItem.label = ''; } if (type === 'area') { newItem.w = 150; newItem.h = 100; }
                setTables([...tables, newItem]); setSaveStatus('local');
            };
            const duplicateTable = () => { const selTable = tables.find(t => t.id === selectedTableId); if (!selTable) return; const newTable = { ...selTable, id: Date.now(), label: selTable.type === 'table' ? `T${tables.filter(t => t.type === 'table').length + 1}` : selTable.label, x: selTable.x + 5, y: selTable.y + 5 }; setTables([...tables, newTable]); setSelectedTableId(newTable.id); setSaveStatus('local'); };
            const updateTable = (id, key, val) => { setTables(prev => prev.map(t => { if (t.id === id) { const updates = { [key]: val }; if (t.subtype === 'round' && (key === 'w' || key === 'h')) { updates.w = val; updates.h = val; } return { ...t, ...updates }; } return t; })); setSaveStatus('local'); };
            const deleteTable = () => { if (selectedTableId) { setTables(prev => prev.filter(t => t.id !== selectedTableId)); setSelectedTableId(null); setSaveStatus('local'); } };
            const saveLayout = async () => { localStorage.setItem('mabelle_tables_autosave', JSON.stringify(tables)); try { await db.collection("settings").doc("tables").set({ layout: tables }); setSaveStatus('saved'); } catch(e) { console.error(e); setSaveStatus('error'); alert("Fehler: " + e.message); } };
            const handlePointerMove = (id, x, y) => { setTables(prev => prev.map(t => t.id === id ? { ...t, x, y } : t)); setSaveStatus('local'); };
            const handlePointerUp = () => {};
            const selTable = tables.find(t => t.id === selectedTableId);

            return (
                <div className={`p-4 rounded-xl shadow-sm border ${theme.card}`}>
                    <div className="flex flex-wrap gap-2 mb-4 justify-between items-center">
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => addItem('table', 'round')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Circle size={16}/> Rund</button>
                            <button onClick={() => addItem('table', 'rect')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Square size={16}/> Eckig</button>
                            <button onClick={() => addItem('wall')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Minus size={16}/> Wand</button>
                            <button onClick={() => addItem('window')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Maximize size={16}/> Fenster</button>
                            <button onClick={() => addItem('door')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><DoorOpen size={16}/> Tür</button>
                            <button onClick={() => addItem('area', 'bar')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Coffee size={16}/> Bar</button>
                            <button onClick={() => addItem('area', 'kitchen')} className="flex items-center gap-1 bg-white border border-stone-200 hover:bg-stone-50 dark:bg-stone-800 dark:border-stone-600 dark:text-stone-200 px-3 py-2 rounded text-sm shadow-sm font-medium"><Utensils size={16}/> Küche</button>
                        </div>
                        <div className="flex gap-2 items-center"><button onClick={saveLayout} className="bg-amber-600 text-white px-4 py-2 rounded shadow flex items-center gap-2 font-bold hover:bg-amber-700 transition-colors">{saveStatus === 'error' ? 'Erzwingen' : 'Speichern'} <Save size={16}/></button></div>
                    </div>
                    <div className="w-full relative border-2 border-dashed border-stone-300 dark:border-stone-600 rounded-lg overflow-hidden">
                        <MapRenderer tables={tables} onTableClick={(e, id) => { e.preventDefault(); setSelectedTableId(id); }} selectedTableId={selectedTableId} isEditor={true} onDragMove={handlePointerMove} onDragEnd={handlePointerUp} />
                    </div>
                    {selTable && (
                        <div className="mt-4 p-4 bg-stone-100 dark:bg-stone-900 rounded-lg flex flex-wrap gap-4 items-center border border-stone-200 dark:border-stone-700">
                            {selTable.type !== 'wall' && selTable.type !== 'window' && selTable.type !== 'door' && <div><label className="text-xs uppercase font-bold text-stone-500">Name</label><input value={selTable.label} onChange={e => updateTable(selTable.id, 'label', e.target.value)} className={`block w-20 p-1 rounded border ${theme.input}`}/></div>}
                            {selTable.type === 'table' && <div><label className="text-xs uppercase font-bold text-stone-500">Plätze</label><input type="number" value={selTable.seats} onChange={e => updateTable(selTable.id, 'seats', parseInt(e.target.value))} className={`block w-16 p-1 rounded border ${theme.input}`}/></div>}
                            <div><label className="text-xs uppercase font-bold text-stone-500">Breite/Größe</label><div className="flex items-center gap-2"><input type="range" min="10" max="400" value={selTable.w} onChange={e => updateTable(selTable.id, 'w', parseInt(e.target.value))} className="block w-24"/><input type="number" value={selTable.w} onChange={e => updateTable(selTable.id, 'w', parseInt(e.target.value))} className={`w-14 p-1 text-xs rounded border ${theme.input} text-center`} /></div></div>
                            {selTable.subtype !== 'round' && (<div><label className="text-xs uppercase font-bold text-stone-500">Höhe</label><div className="flex items-center gap-2"><input type="range" min="4" max="400" value={selTable.h} onChange={e => updateTable(selTable.id, 'h', parseInt(e.target.value))} className="block w-24"/><input type="number" value={selTable.h} onChange={e => updateTable(selTable.id, 'h', parseInt(e.target.value))} className={`w-14 p-1 text-xs rounded border ${theme.input} text-center`} /></div></div>)}
                            <div><label className="text-xs uppercase font-bold text-stone-500">Rotation</label><div className="flex items-center gap-2"><input type="range" min="0" max="360" value={selTable.rotation || 0} onChange={e => updateTable(selTable.id, 'rotation', parseInt(e.target.value))} className="block w-24"/><input type="number" min="0" max="360" value={selTable.rotation || 0} onChange={e => updateTable(selTable.id, 'rotation', parseInt(e.target.value))} className={`w-14 p-1 text-xs rounded border ${theme.input} text-center`} /><span className="text-xs text-stone-500">°</span></div></div>
                            <div className="flex gap-2 ml-auto"><button onClick={duplicateTable} className="text-blue-500 hover:bg-blue-100 p-2 rounded flex items-center gap-1" title="Kopieren"><Copy size={18}/></button><button onClick={deleteTable} className="text-red-500 hover:bg-red-100 p-2 rounded"><Trash2 size={18}/></button></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- ADMIN VIEW ---
        const AdminView = ({ employees, reservations, setView, theme, isDarkMode, db, tableLayout, pacingSettings, isSharedDevice, toggleSharedDevice }) => {
            const [activeTab, setActiveTab] = useState('employees');
            const [empName, setEmpName] = useState('');
            const [empPin, setEmpPin] = useState('');
            const [empRole, setEmpRole] = useState('staff');
            const [editingEmpId, setEditingEmpId] = useState(null);
            const [error, setError] = useState('');

            // Pacing Settings State
            const [timeBlocksStr, setTimeBlocksStr] = useState(pacingSettings?.timeBlocks ? pacingSettings.timeBlocks.join(', ') : '17:00-19:30, 19:30-22:00');
            const [warnThresh, setWarnThresh] = useState(pacingSettings?.warning || 20);
            const [dangerThresh, setDangerThresh] = useState(pacingSettings?.danger || 30);

            const handleSaveEmployee = async (e) => {
                e.preventDefault(); setError('');
                if(empName && empPin) {
                    const pinExists = employees.some(emp => emp.pin === empPin && emp.id !== editingEmpId);
                    if (pinExists) { setError('PIN bereits vergeben!'); return; }
                    try {
                        if (editingEmpId) await db.collection("employees").doc(editingEmpId).update({ name: empName, pin: empPin, role: empRole });
                        else await db.collection("employees").add({ name: empName, pin: empPin, role: empRole });
                        setEmpName(''); setEmpPin(''); setEmpRole('staff'); setEditingEmpId(null);
                    } catch (e) { console.error(e); }
                }
            };
            const startEdit = (emp) => { setEmpName(emp.name); setEmpPin(emp.pin); setEmpRole(emp.role); setEditingEmpId(emp.id); setError(''); window.scrollTo({ top: 0, behavior: 'smooth' }); };
            const deleteEmployee = async (id) => { if (window.confirm('Löschen?')) await db.collection("employees").doc(id).delete(); };
            
            // NEU: Funktion zum Trennen des Geräts
            const resetDevice = async (id) => { 
                if (window.confirm('Geräte-Verknüpfung (Face-ID) für diesen Mitarbeiter löschen? Er kann sein Profil danach auf einem neuen Handy registrieren.')) {
                    await db.collection("employees").doc(id).update({ hasBiometric: false });
                }
            };

            const handleSavePacing = async (e) => {
                e.preventDefault();
                const blocksArr = timeBlocksStr.split(',').map(s => s.trim()).filter(s => s.length > 0);
                try {
                    await db.collection("settings").doc("pacing").set({
                        timeBlocks: blocksArr,
                        warning: parseInt(warnThresh, 10),
                        danger: parseInt(dangerThresh, 10)
                    });
                    alert("Einstellungen gespeichert!");
                } catch(e) { alert("Fehler beim Speichern"); }
            };

            const adminCount = employees.filter(e => e.role === 'admin').length;

            return (
                <div className={`min-h-screen p-4 ${theme.bg} ${theme.text}`}>
                    <header className="max-w-4xl mx-auto flex justify-between items-center mb-8 pt-4"><h1 className="text-2xl font-bold flex items-center gap-2"><Shield className="text-amber-600"/> Admin Dashboard</h1><button onClick={() => setView('book')} className={`px-4 py-2 rounded-lg ${theme.card} border shadow-sm`}>Zurück</button></header>
                    <div className="max-w-4xl mx-auto">
                        <div className="flex gap-2 mb-6 overflow-x-auto">
                            <button onClick={() => setActiveTab('employees')} className={`px-6 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ${activeTab === 'employees' ? 'bg-amber-600 text-white' : `${theme.card} ${theme.textMuted}`}`}>Mitarbeiter</button>
                            <button onClick={() => setActiveTab('tables')} className={`px-6 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ${activeTab === 'tables' ? 'bg-amber-600 text-white' : `${theme.card} ${theme.textMuted}`}`}>Tischplan</button>
                            <button onClick={() => setActiveTab('settings')} className={`px-6 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ${activeTab === 'settings' ? 'bg-amber-600 text-white' : `${theme.card} ${theme.textMuted}`}`}>Einstellungen</button>
                        </div>
                        
                        {activeTab === 'employees' && (
                            <div className={`p-6 rounded-xl shadow-sm border ${theme.card}`}>
                                <h3 className="font-bold text-lg mb-4">{editingEmpId ? 'Bearbeiten' : 'Neu'}</h3>
                                <form onSubmit={handleSaveEmployee} className="flex flex-col gap-3 mb-8">
                                    <div className="flex flex-col md:flex-row gap-3"><input value={empName} onChange={e => setEmpName(e.target.value)} placeholder="Name" className={`flex-1 p-3 rounded-lg border ${theme.input}`} required /><div className="flex gap-3"><input value={empPin} onChange={e => setEmpPin(e.target.value)} placeholder="PIN (4)" maxLength={4} inputMode="numeric" className={`w-24 p-3 rounded-lg border ${theme.input}`} required /><select value={empRole} onChange={e => setEmpRole(e.target.value)} className={`flex-1 p-3 rounded-lg border ${theme.input} bg-transparent`}><option value="staff">Kellner</option><option value="chef">Koch</option><option value="admin">Admin</option></select></div><div className="flex gap-2"><button type="submit" className="bg-emerald-600 text-white p-3 rounded-lg flex-1 font-bold">{editingEmpId ? 'Speichern' : 'Hinzufügen'}</button></div></div>
                                    {error && <div className="text-red-500 text-sm p-2 bg-red-50 rounded border border-red-100">{error}</div>}
                                </form>
                                <div className="divide-y divide-stone-200 dark:divide-stone-700">
                                    {employees.map(emp => (
                                        <div key={emp.id} className="py-3 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold flex items-center gap-2">
                                                    {emp.name}
                                                    {emp.hasBiometric && <span className="bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400 text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider flex items-center gap-1 shadow-sm"><ScanFace size={10}/> Verknüpft</span>}
                                                </div>
                                                <div className={`text-xs ${theme.textMuted}`}>PIN: {emp.pin} ({emp.role})</div>
                                            </div>
                                            <div className="flex gap-2">
                                                {emp.hasBiometric && <button onClick={() => resetDevice(emp.id)} className="text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/30 p-2 rounded transition-colors" title="Geräte-Verknüpfung aufheben"><Smartphone size={18}/></button>}
                                                <button onClick={() => startEdit(emp)} className="text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 p-2 rounded transition-colors"><Edit2 size={18}/></button>
                                                {(emp.role !== 'admin' || adminCount > 1) && <button onClick={() => deleteEmployee(emp.id)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-2 rounded transition-colors"><Trash2 size={18}/></button>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        {activeTab === 'tables' && <TableEditor initialLayout={tableLayout} db={db} theme={theme} isDarkMode={isDarkMode} />}
                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <div className={`p-6 rounded-xl shadow-sm border ${theme.card}`}>
                                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><SettingsIcon className="text-amber-600"/> Pacing & Auslastung</h3>
                                    <form onSubmit={handleSavePacing} className="space-y-4">
                                        <div>
                                            <label className={`block text-sm font-medium mb-1 ${theme.textMuted}`}>Überwachte Zeitblöcke (Kommagetrennt)</label>
                                            <input value={timeBlocksStr} onChange={e => setTimeBlocksStr(e.target.value)} placeholder="z.B. 17:00-19:30, 19:30-22:00" className={`w-full p-3 rounded-lg border ${theme.input}`} />
                                            <p className={`text-xs mt-1 ${theme.textMuted}`}>Geben Sie Zeitspannen wie 18:00-20:00 an. Einfach "18-20" reicht auch!</p>
                                        </div>
                                        <div className="flex flex-col md:flex-row gap-4">
                                            <div className="flex-1">
                                                <label className={`block text-sm font-medium mb-1 ${theme.textMuted}`}>Warnung (Gelb) ab X Gästen</label>
                                                <input type="number" value={warnThresh} onChange={e => setWarnThresh(e.target.value)} className={`w-full p-3 rounded-lg border ${theme.input}`} />
                                            </div>
                                            <div className="flex-1">
                                                <label className={`block text-sm font-medium mb-1 ${theme.textMuted}`}>Kritisch (Rot) ab X Gästen</label>
                                                <input type="number" value={dangerThresh} onChange={e => setDangerThresh(e.target.value)} className={`w-full p-3 rounded-lg border ${theme.input}`} />
                                            </div>
                                        </div>
                                        <div className="pt-2"><button type="submit" className="bg-amber-600 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto hover:bg-amber-700 transition-colors">Einstellungen speichern</button></div>
                                    </form>
                                </div>
                                
                                <div className={`p-6 rounded-xl shadow-sm border ${theme.card}`}>
                                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Monitor className="text-amber-600"/> Geteiltes Laden-Tablet</h3>
                                    <div className="flex items-center justify-between gap-4">
                                        <div className="flex-1">
                                            <p className={`text-sm ${theme.textMuted}`}>
                                                Wenn diese Funktion aktiviert ist, entfällt der <strong>Face-ID / Fingerabdruck Zwang</strong> für dieses spezifische Gerät. Das Team loggt sich hier dann nur über die 4-stellige PIN ein. (Ideal für Kassen)
                                            </p>
                                        </div>
                                        <button 
                                            type="button" 
                                            onClick={toggleSharedDevice} 
                                            className={`shrink-0 relative inline-flex h-8 w-14 items-center rounded-full transition-colors focus:outline-none ${isSharedDevice ? 'bg-emerald-500' : 'bg-stone-300 dark:bg-stone-600'}`}
                                        >
                                            <span className={`inline-block h-6 w-6 transform rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out ${isSharedDevice ? 'translate-x-7' : 'translate-x-1'}`} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- RESERVATION BOOK ---
        const ReservationBook = ({ currentUser, handleLogout, theme, isDarkMode, toggleDarkMode, setView, reservations, db, tableLayout, pacingSettings, forceSync, isSyncing }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [showTableSelector, setShowTableSelector] = useState(false); 
            const [showCalendar, setShowCalendar] = useState(false); 
            const [showPacing, setShowPacing] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeFilter, setActiveFilter] = useState('active'); // 'active' | 'completed'
            const dateInputRef = useRef(null);
            const [showNoShowDetails, setShowNoShowDetails] = useState(false);
            
            // FORM DATA mit neuem "instagram" Feld
            const [formData, setFormData] = useState({ name: '', time: '18:00', pax: 2, table: '', phone: '', instagram: '', notes: '', date: '' });
            const [tempSelectedTables, setTempSelectedTables] = useState([]);

            // TIMER FÜR LIVE-STATUS UPDATE
            const [realTime, setRealTime] = useState(new Date());
            useEffect(() => {
                const intervalId = setInterval(() => {
                    setRealTime(new Date());
                }, 30000); // Checkt jede halbe Minute
                return () => clearInterval(intervalId);
            }, []);

            const hoursList = Array.from({length: 14}, (_, i) => (i + 10).toString().padStart(2, '0')); 
            const minutesList = ['00', '15', '30', '45'];

            const availableTags = [{ id: 'Geburtstag', label: 'Geburtstag', icon: Gift, color: 'text-pink-600 bg-pink-100 border-pink-200' }, { id: 'Fußball', label: 'Fußball', icon: Trophy, color: 'text-blue-600 bg-blue-100 border-blue-200' }, { id: 'Terasse', label: 'Terasse', icon: SunIcon, color: 'text-orange-600 bg-orange-100 border-orange-200' }];
            const formatDateDE = (date) => date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'long', year: 'numeric' });
            
            const getIsoDate = (dateObj) => {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const isPastCutoff = useMemo(() => {
                const threeDaysAgo = new Date();
                threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
                threeDaysAgo.setHours(0, 0, 0, 0);
                const currentSelectedDate = new Date(currentDate);
                currentSelectedDate.setHours(0, 0, 0, 0);
                return currentSelectedDate < threeDaysAgo;
            }, [currentDate]);
            
            const handleModalPrevDay = (e) => { e.preventDefault(); const [y, m, d] = formData.date.split('-').map(Number); const date = new Date(y, m - 1, d); date.setDate(date.getDate() - 1); setFormData(prev => ({ ...prev, date: getIsoDate(date) })); };
            const handleModalNextDay = (e) => { e.preventDefault(); const [y, m, d] = formData.date.split('-').map(Number); const date = new Date(y, m - 1, d); date.setDate(date.getDate() + 1); setFormData(prev => ({ ...prev, date: getIsoDate(date) })); };
            const formatModalDate = (isoDate) => { if (!isoDate) return ''; const [y, m, d] = isoDate.split('-').map(Number); const date = new Date(y, m - 1, d); return date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'long', year: 'numeric' }); };

            const handleDateChange = (e) => { if (!e.target.value) return; const [year, month, day] = e.target.value.split('-').map(Number); setCurrentDate(new Date(year, month - 1, day)); };
            const handlePrevDay = () => { const newDate = new Date(currentDate); newDate.setDate(currentDate.getDate() - 1); setCurrentDate(newDate); };
            const handleNextDay = () => { const newDate = new Date(currentDate); newDate.setDate(currentDate.getDate() + 1); setCurrentDate(newDate); };
            
            const handleInputChange = (e) => { 
                const { name, value } = e.target; 
                setFormData(prev => {
                    const updated = { ...prev, [name]: value };
                    
                    // --- MINI CRM: AUTO-FILL LOGIK ---
                    const isPhoneTrigger = name === 'phone' && value.replace(/[\s\-\+\/]/g, '').length >= 8;
                    const isIgTrigger = name === 'instagram' && value.replace(/^@/, '').trim().length >= 5;
                    
                    // Wenn Telefon (ab 8 Ziff.) oder Insta (ab 5 Z.) eingetippt wird und Name leer ist
                    if ((isPhoneTrigger || isIgTrigger) && !prev.name) {
                        const searchVal = value.trim().toLowerCase();
                        
                        // Finde den aktuellsten, vergangenen Eintrag für diese Nummer / dieses Insta
                        const pastMatch = [...reservations].reverse().find(r => {
                            if (name === 'phone' && r.phone) {
                                // Entfernt Leerzeichen/Sonderzeichen für einen robusteren Abgleich
                                return r.phone.replace(/[\s\-\+\/]/g, '') === value.replace(/[\s\-\+\/]/g, '');
                            }
                            if (name === 'instagram' && r.instagram) {
                                return r.instagram.trim().toLowerCase() === searchVal.replace(/^@/, '');
                            }
                            return false;
                        });
                        
                        // Wenn es einen Treffer gab, fülle den Namen automatisch aus!
                        if (pastMatch && pastMatch.name) {
                            updated.name = pastMatch.name;
                        }
                    }
                    
                    return updated;
                }); 
            };

            const toggleTag = (label) => { setFormData(prev => { let currentNotes = prev.notes || ""; const lines = currentNotes.split('\n'); if (lines.includes(label)) { const newNotes = lines.filter(l => l !== label).join('\n'); return { ...prev, notes: newNotes.trim() }; } else { const newNotes = label + (currentNotes ? '\n' + currentNotes : ''); return { ...prev, notes: newNotes }; } }); };
            const handleTimeChange = (part, value) => {
                const [h, m] = formData.time.split(':');
                if (part === 'h') setFormData(prev => ({ ...prev, time: `${value}:${m}` }));
                if (part === 'm') setFormData(prev => ({ ...prev, time: `${h}:${value}` }));
            };

            // MINI CRM: NO-SHOW PRÜFUNG (LIVE BEIM EINTIPPEN)
            const pastNoShows = useMemo(() => {
                const checkPhone = (formData.phone || '').trim();
                const checkIg = (formData.instagram || '').trim();
                
                if (!checkPhone && !checkIg) return [];
                
                // Wir suchen in allen Reservierungen, ob diese Nummer/IG jemals "no-show" war.
                return reservations.filter(r => 
                    r.status === 'no-show' && 
                    (
                        (checkPhone && r.phone && r.phone.replace(/[\s\-\+\/]/g, '') === checkPhone.replace(/[\s\-\+\/]/g, '')) || 
                        (checkIg && r.instagram && r.instagram.trim().toLowerCase() === checkIg.replace(/^@/, '').toLowerCase())
                    )
                ).sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [formData.phone, formData.instagram, reservations]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                // Pflicht-Check: Entweder Telefon ODER Instagram muss ausgefüllt sein.
                const phoneVal = (formData.phone || '').trim();
                const igVal = (formData.instagram || '').trim();
                
                if (!phoneVal && !igVal) {
                    alert('Bitte geben Sie eine Telefonnummer oder einen Instagram-Namen an!');
                    return;
                }

                // --- LÄNGEN-CHECK ---
                if (phoneVal) {
                    const cleanPhone = phoneVal.replace(/[\s\-\+\/]/g, ''); 
                    if (cleanPhone.length > 0 && cleanPhone.length < 8) {
                        alert('Die Telefonnummer ist zu kurz (mindestens 8 Zeichen).');
                        return;
                    }
                }

                if (igVal) {
                    const cleanIg = igVal.replace(/^@/, '').trim();
                    if (cleanIg.length > 0 && cleanIg.length < 5) {
                        alert('Der Instagram-Name ist zu kurz (mindestens 5 Zeichen).');
                        return;
                    }
                }
                // ---------------------------------------------

                try {
                    const now = new Date().toISOString();
                    const [y, m, d] = formData.date.split('-').map(Number);
                    const newDateObj = new Date(y, m - 1, d);
                    const newDateString = newDateObj.toDateString();

                    const cleanData = { ...formData, phone: phoneVal, instagram: igVal };

                    if (editingId) {
                        await db.collection("reservations").doc(editingId).update({ ...cleanData, date: newDateString, pax: parseInt(formData.pax, 10), updatedBy: currentUser.name, updatedAt: now });
                    } else {
                        const newRes = { ...cleanData, date: newDateString, pax: parseInt(formData.pax, 10), status: 'confirmed', createdBy: currentUser.name, createdAt: now, updatedBy: null, updatedAt: null };
                        await db.collection("reservations").add(newRes);
                    }
                    closeModal();
                } catch (e) { console.error("Error saving reservation: ", e); }
            };

            const openAddModal = () => { setEditingId(null); setFormData({ name: '', time: '18:00', pax: 2, table: '', phone: '', instagram: '', notes: '', date: getIsoDate(currentDate) }); setShowNoShowDetails(false); setIsModalOpen(true); };
            const openEditModal = (res) => { if (currentUser.role === 'chef') return; setEditingId(res.id); const d = new Date(res.date); setFormData({ name: res.name, time: res.time, pax: res.pax, table: res.table, phone: res.phone || '', instagram: res.instagram || '', notes: res.notes || '', date: getIsoDate(d) }); setShowNoShowDetails(false); setIsModalOpen(true); };
            const closeModal = () => setIsModalOpen(false);
            const updateStatus = async (id, newStatus) => {
                try {
                    const now = new Date().toISOString();
                    await db.collection("reservations").doc(id).update({ status: newStatus, updatedBy: currentUser.name, updatedAt: now });
                } catch (e) { console.error("Error updating status: ", e); }
            };

            const filteredReservations = useMemo(() => {
                if (isPastCutoff) return [];
                let filtered = reservations.filter(res => res.date === currentDate.toDateString());
                if (searchTerm) { const lowerTerm = searchTerm.toLowerCase(); filtered = filtered.filter(res => res.name.toLowerCase().includes(lowerTerm) || (res.phone && res.phone.includes(searchTerm)) || (res.instagram && res.instagram.toLowerCase().includes(lowerTerm)) || (res.table && res.table.toLowerCase().includes(lowerTerm)) || (res.notes && res.notes.toLowerCase().includes(lowerTerm))); }
                if (activeFilter === 'active') { filtered = filtered.filter(res => res.status === 'confirmed'); }
                else if (activeFilter === 'completed') { filtered = filtered.filter(res => ['arrived', 'cancelled', 'no-show'].includes(res.status)); }
                return filtered.sort((a, b) => a.time.localeCompare(b.time));
            }, [reservations, currentDate, searchTerm, activeFilter, isPastCutoff]);
            
            const stats = useMemo(() => {
                if (isPastCutoff) return { openGuests: 0, completedGuests: 0 };
                const dailyRes = reservations.filter(res => res.date === currentDate.toDateString());
                const openGuests = dailyRes.filter(res => res.status === 'confirmed').reduce((sum, res) => sum + parseInt(res.pax || 0, 10), 0);
                const completedGuests = dailyRes.filter(res => res.status === 'arrived').reduce((sum, res) => sum + parseInt(res.pax || 0, 10), 0);
                return { openGuests, completedGuests };
            }, [reservations, currentDate, isPastCutoff]);

            // PACING LOGIC
            const timeToMinutes = (t) => {
                if (!t) return 0;
                const cleanT = t.replace(/[^\d:]/g, ''); 
                const parts = cleanT.split(':');
                const h = parseInt(parts[0], 10) || 0;
                const m = parts.length > 1 ? parseInt(parts[1], 10) || 0 : 0;
                return h * 60 + m;
            };

            const pacingStats = useMemo(() => {
                const pStats = {};
                const blocksConfig = pacingSettings?.timeBlocks || ['17:00-19:30', '19:30-22:00'];
                blocksConfig.forEach(b => pStats[b] = { pax: 0 });
                if (isPastCutoff) return { blocks: blocksConfig, stats: pStats };
                
                const activeRes = reservations.filter(res => {
                    if (res.date !== currentDate.toDateString()) return false;
                    if (activeFilter === 'completed') return ['arrived', 'cancelled', 'no-show'].includes(res.status);
                    return res.status === 'confirmed';
                });

                activeRes.forEach(res => {
                    if(!res.time) return;
                    const resMins = timeToMinutes(res.time);
                    
                    blocksConfig.forEach(block => {
                        const [startStr, endStr] = block.split('-');
                        if (startStr && endStr) {
                            const startMins = timeToMinutes(startStr);
                            const endMins = timeToMinutes(endStr);
                            
                            let isMatch = false;
                            if (startMins <= endMins) {
                                isMatch = (resMins >= startMins && resMins < endMins);
                            } else {
                                isMatch = (resMins >= startMins || resMins < endMins);
                            }
                            
                            if (isMatch) {
                                pStats[block].pax += parseInt(res.pax || 0, 10);
                            }
                        }
                    });
                });
                return { blocks: blocksConfig, stats: pStats };
            }, [reservations, currentDate, pacingSettings, activeFilter, isPastCutoff]);


            const renderNoteContent = (noteText) => { if (!noteText) return null; const lines = noteText.split('\n'); return lines.map((line, idx) => { const tag = availableTags.find(t => t.label === line.trim()); if (tag) { const TagIcon = tag.icon; return (<div key={idx} className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] uppercase font-bold tracking-wide border w-max mb-1 mr-1 ${tag.color} ${theme.tag(tag.color)}`}><TagIcon size={10} />{tag.label}</div>); } return (<div key={idx} className={`text-sm truncate italic ${theme.textMuted}`}>{line}</div>); }); };
            
            const openTableSelector = () => { const currentTables = formData.table ? formData.table.split('+').map(s => s.trim()) : []; setTempSelectedTables(currentTables); setShowTableSelector(true); };
            const toggleTableSelection = (tableLabel) => { setTempSelectedTables(prev => { if (prev.includes(tableLabel)) { return prev.filter(t => t !== tableLabel); } else { return [...prev, tableLabel]; } }); };
            const confirmTableSelection = () => { setFormData(prev => ({ ...prev, table: tempSelectedTables.join(' + ') })); setShowTableSelector(false); };
            const formatDateTime = (isoString) => { if (!isoString) return ''; const d = new Date(isoString); return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); };

            return (
                <div className={`min-h-screen font-sans transition-colors duration-300 ${theme.bg} ${theme.text}`}>
                    <header className={`shadow-sm sticky top-0 z-10 transition-colors duration-300 ${theme.header}`}>
                        <div className="max-w-5xl mx-auto px-4 py-4 relative">
                            <div className="absolute top-4 left-4 flex gap-1 md:hidden z-20">
                                <button onClick={() => setView('admin')} className="p-2 rounded-lg border border-amber-300 text-amber-700 bg-amber-50 hover:bg-amber-100"><Shield size={20} /></button>
                                <button onClick={toggleDarkMode} className={`p-2 rounded-lg border transition-colors ${isDarkMode ? 'bg-stone-800 border-stone-600 text-amber-400 hover:bg-stone-700' : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-50'}`}>{isDarkMode ? <Sun size={20} /> : <Moon size={20} />}</button>
                                <button onClick={forceSync} className={`p-2 rounded-lg border transition-colors ${isDarkMode ? 'bg-stone-800 border-stone-600 text-blue-400 hover:bg-stone-700' : 'bg-white border-stone-200 text-blue-500 hover:bg-stone-50'}`} title="Synchronisieren"><RotateCcw size={20} className={isSyncing ? 'animate-spin' : ''} /></button>
                            </div>
                            <button onClick={handleLogout} className={`absolute top-4 right-4 p-2 rounded-lg border border-red-200 text-red-500 bg-white hover:bg-red-50 md:hidden z-20`}><LogOut size={20} /></button>
                            <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-1.5"><div className="bg-amber-600 p-2 rounded-lg text-white self-start mt-0.5"><Coffee size={24} /></div><div className="flex flex-col"><h1 className={`text-3xl font-mabelle tracking-widest uppercase leading-none ${isDarkMode ? 'text-stone-100' : 'text-stone-900'}`}>MABELLE</h1><span className="text-amber-600 font-sans text-xs font-bold uppercase tracking-[0.2em] leading-tight pt-1">Reservierungen</span></div></div>
                                <div className={`flex items-center rounded-full px-2 py-1 border shadow-inner transition-colors ${theme.navBg}`}><button onClick={handlePrevDay} className={`p-2 rounded-full transition-all z-10 relative ${isDarkMode ? 'hover:bg-stone-700 text-stone-400' : 'hover:bg-white text-stone-500'} hover:text-amber-600`}><ChevronLeft size={20} /></button><div className={`relative flex items-center justify-center gap-2 px-3 py-1.5 min-w-[180px] font-medium cursor-pointer group hover:text-amber-600 transition-colors rounded-md mx-1 ${isDarkMode ? 'text-stone-300 hover:bg-stone-800' : 'text-stone-700 hover:bg-stone-100'}`} onClick={() => setShowCalendar(true)}><CalendarIcon size={16} className="text-amber-600 shrink-0" /><span className="pointer-events-none select-none text-base whitespace-nowrap">{formatDateDE(currentDate)}</span></div><button onClick={handleNextDay} className={`p-2 rounded-full transition-all z-10 relative ${isDarkMode ? 'hover:bg-stone-700 text-stone-400' : 'hover:bg-white text-stone-500'} hover:text-amber-600`}><ChevronRight size={20} /></button></div>
                                <div className="hidden md:flex gap-2 items-center">
                                    <button onClick={forceSync} className={`p-2.5 rounded-lg border transition-colors ${isDarkMode ? 'bg-stone-800 border-stone-600 text-blue-400 hover:bg-stone-700' : 'bg-white border-stone-200 text-blue-500 hover:bg-stone-50'}`} title="Daten jetzt synchronisieren"><RotateCcw size={20} className={isSyncing ? 'animate-spin' : ''} /></button>
                                    {currentUser.role === 'admin' && <button onClick={() => setView('admin')} className="p-2.5 rounded-lg border border-amber-200 text-amber-600 hover:bg-amber-50 bg-white" title="Admin Dashboard"><Shield size={20} /></button>}
                                    <button onClick={toggleDarkMode} className={`p-2.5 rounded-lg border transition-colors ${isDarkMode ? 'bg-stone-800 border-stone-600 text-amber-400 hover:bg-stone-700' : 'bg-white border-stone-200 text-stone-500 hover:bg-stone-50'}`}>{isDarkMode ? <Sun size={20} /> : <Moon size={20} />}</button>
                                    <button onClick={handleLogout} className="p-2.5 rounded-lg border border-stone-200 text-stone-500 hover:bg-stone-100 bg-white" title="Abmelden"><LogOut size={20} /></button>
                                    {currentUser.role !== 'chef' && <button onClick={openAddModal} className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-lg shadow-md flex items-center gap-2 font-medium transition-all active:scale-95"><Plus size={20} /><span>Neue Reservierung</span></button>}
                                </div>
                            </div>
                            <div className="mt-6 flex flex-col md:flex-row justify-between items-end gap-4">
                                <div className="flex justify-between items-stretch w-full md:w-auto md:justify-start gap-3">
                                    <div className="relative">
                                        <div onClick={() => { if(activeFilter !== 'completed' && !isPastCutoff) setShowPacing(!showPacing); }} className={`flex-1 md:flex-initial border rounded-lg px-3 py-1 flex items-center gap-2 shadow-sm min-w-[140px] transition-colors ${activeFilter !== 'completed' && !isPastCutoff ? 'cursor-pointer hover:opacity-80' : ''} ${theme.card}`}>
                                            <div className={`p-1.5 rounded-md ${isDarkMode ? 'bg-amber-900/40 text-amber-500' : 'bg-amber-100 text-amber-700'}`}><Users size={16} /></div>
                                            <div className="flex-1">
                                                <div className={`text-[10px] uppercase font-semibold flex items-center gap-1 ${theme.textMuted}`}>{activeFilter !== 'completed' ? 'Gäste Offen' : 'Gäste (Erledigt)'} {activeFilter !== 'completed' && !isPastCutoff && <ChevronDown size={12}/>}</div>
                                                <div className={`text-lg font-bold ${isDarkMode ? 'text-stone-100' : 'text-stone-800'}`}>{activeFilter !== 'completed' ? stats.openGuests : stats.completedGuests}</div>
                                            </div>
                                        </div>
                                        {/* PACING POPOVER */}
                                        {showPacing && activeFilter !== 'completed' && !isPastCutoff && (
                                            <div className={`absolute top-full left-0 mt-2 w-64 rounded-xl shadow-xl border z-50 overflow-hidden animate-dropdown ${theme.card}`}>
                                                <div className="bg-amber-600 px-4 py-2 flex justify-between items-center text-white">
                                                    <span className="text-xs font-bold uppercase tracking-wider">Auslastung (Pacing)</span>
                                                    <button onClick={(e) => { e.stopPropagation(); setShowPacing(false); }} className="hover:opacity-70"><X size={16}/></button>
                                                </div>
                                                <div className="p-2 space-y-1">
                                                    {pacingStats.blocks.map(block => {
                                                        const data = pacingStats.stats[block];
                                                        const isWarning = data.pax >= (pacingSettings?.warning || 20);
                                                        const isDanger = data.pax >= (pacingSettings?.danger || 30);
                                                        let badgeColor = isDarkMode ? 'bg-stone-700 text-stone-300' : 'bg-stone-100 text-stone-600';
                                                        if (isDanger) badgeColor = 'bg-red-500 text-white animate-pulse shadow-md';
                                                        else if (isWarning) badgeColor = 'bg-amber-500 text-white shadow-sm';

                                                        return (
                                                            <div key={block} className={`flex justify-between items-center p-2 rounded-lg transition-colors ${theme.hover}`}>
                                                                <span className="font-bold text-sm">{block}</span>
                                                                <div className="flex items-center gap-2">
                                                                    <span className={`px-2 py-0.5 rounded-md text-sm font-bold flex items-center gap-1 ${badgeColor}`}>{data.pax} Gäste <Users size={12}/></span>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    {currentUser.role !== 'chef' && <button onClick={openAddModal} className="md:hidden bg-amber-600 hover:bg-amber-700 text-white px-6 py-1 rounded-lg shadow-md flex items-center justify-center gap-2 font-medium transition-all active:scale-95 whitespace-nowrap"><Plus size={20} /> <span>Neu</span></button>}
                                </div>
                                <div className="relative w-full md:w-72"><Search className={`absolute left-3 top-1/2 transform -translate-y-1/2 ${theme.textMuted}`} size={18} /><input type="text" placeholder="Name, Tisch, Insta, Telefon..." className={`w-full pl-10 pr-4 py-2.5 rounded-lg border focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm text-sm transition-colors ${theme.input}`} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 py-6">
                        <div className={`flex p-1 rounded-xl mb-6 w-max overflow-x-auto ${isDarkMode ? 'bg-stone-800' : 'bg-stone-200/50'}`}>
                            <button onClick={() => { setActiveFilter('active'); setShowPacing(false); }} className={`px-5 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap flex items-center gap-1.5 ${activeFilter === 'active' ? (isDarkMode ? 'bg-stone-700 text-stone-100 shadow-sm' : 'bg-white text-stone-900 shadow-sm') : (isDarkMode ? 'text-stone-400 hover:text-stone-200' : 'text-stone-500 hover:text-stone-700')}`}>Offen</button>
                            <button onClick={() => { setActiveFilter('completed'); setShowPacing(false); }} className={`px-5 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap flex items-center gap-1.5 ${activeFilter === 'completed' ? (isDarkMode ? 'bg-stone-700 text-stone-100 shadow-sm' : 'bg-white text-stone-900 shadow-sm') : (isDarkMode ? 'text-stone-400 hover:text-stone-200' : 'text-stone-500 hover:text-stone-700')}`}>Erledigt</button>
                        </div>
                        
                        <div className={`md:rounded-xl md:shadow-sm md:border md:overflow-hidden transition-colors ${isDarkMode ? 'md:border-stone-700 md:bg-stone-800' : 'md:border-stone-200 md:bg-white'}`}>
                            <div className={`hidden md:grid grid-cols-12 gap-2 p-4 border-b text-xs font-bold uppercase tracking-wider items-center ${theme.tableHeader}`}><div className="col-span-1">Zeit</div><div className="col-span-4">Name</div><div className="col-span-1 text-center">Pers.</div><div className="col-span-1 text-center">Tisch</div><div className="col-span-3">Notizen</div><div className="col-span-2 text-right">Status</div></div>
                            <div className={`md:divide-y ${isDarkMode ? 'md:divide-stone-700' : 'md:divide-stone-100'}`}>
                                {filteredReservations.length === 0 ? (
                                    <div className={`p-12 text-center ${theme.textMuted}`}><div className="flex justify-center mb-4"><Archive size={48} className="opacity-20" /></div><p>{isPastCutoff ? "Daten aus der Vergangenheit (älter als 3 Tage) werden nicht mehr angezeigt." : (activeFilter === 'completed' ? "Keine erledigten Reservierungen." : "Keine offenen Reservierungen für diesen Tag.")}</p></div>
                                ) : (
                                    filteredReservations.map((res, index) => {
                                        // VERSPÄTUNGS-CHECK (Zeit-Warnung)
                                        const delayStatus = (() => {
                                            if (res.status !== 'confirmed') return null;
                                            const resDate = new Date(res.date);
                                            if (isNaN(resDate.getTime()) || !res.time) return null;
                                            const [h, m] = res.time.split(':').map(Number);
                                            resDate.setHours(h, m, 0, 0);
                                            
                                            const diffMins = (realTime - resDate) / 60000;
                                            if (diffMins >= 15) return 'red';
                                            if (diffMins >= 10) return 'yellow';
                                            return null;
                                        })();

                                        return (
                                            <div key={res.id} onClick={() => openEditModal(res)} style={{ animationDelay: `${index * 40}ms` }} className={`animate-slide-fade cursor-pointer flex flex-col gap-1 p-3 rounded-xl border mb-2 shadow-sm relative ${isDarkMode ? 'bg-stone-800 border-stone-700' : 'bg-white border-stone-200'} md:grid md:grid-cols-12 md:gap-2 md:p-4 md:items-start md:border-0 md:rounded-none md:shadow-none md:mb-0 transition-colors group ${theme.rowHover} ${res.status === 'confirmed' ? 'md:bg-transparent' : ''} ${res.status === 'cancelled' ? (isDarkMode ? 'opacity-80 bg-stone-950/40 border-l-4 border-l-stone-600 md:bg-stone-950/40' : 'opacity-90 bg-stone-100 border-l-4 border-l-stone-400 md:bg-stone-100') : ''} ${res.status === 'no-show' ? (isDarkMode ? 'opacity-90 bg-red-950/60 border-l-4 border-l-red-600 md:bg-red-950/60' : 'opacity-95 bg-red-100 border-l-4 border-l-red-600 md:bg-red-100') : ''} ${res.status === 'arrived' ? (isDarkMode ? 'bg-emerald-900/40 border-l-4 border-l-emerald-600 md:bg-emerald-900/40' : 'bg-emerald-100/80 border-l-4 border-l-emerald-500 md:bg-emerald-100/80') : ''}`}>
                                                <div className="flex justify-between items-center md:hidden overflow-hidden mb-0.5">
                                                    <div className="flex items-center gap-3 overflow-hidden">
                                                        <div className={`font-bold text-lg whitespace-nowrap flex items-center gap-1 ${isDarkMode ? 'text-stone-200' : 'text-stone-800'}`}><Clock size={16} className={(res.status === 'cancelled' || res.status === 'no-show') ? 'text-red-500' : 'text-amber-600'} /> {res.time}</div>
                                                        <div className={`font-medium text-lg truncate hover:text-amber-600 transition-colors ${(res.status === 'cancelled' || res.status === 'no-show') ? 'line-through text-stone-500' : (isDarkMode ? 'text-stone-100' : 'text-stone-900')}`}>{res.name}</div>
                                                    </div>
                                                    <div className="flex items-center gap-2 shrink-0">
                                                        {res.status === 'confirmed' && delayStatus === 'red' && <div className="w-3 h-3 rounded-full bg-red-500 animate-blink shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>}
                                                        {res.status === 'confirmed' && delayStatus === 'yellow' && <div className="w-3 h-3 rounded-full bg-amber-400 animate-blink shadow-[0_0_8px_rgba(251,191,36,0.8)]"></div>}
                                                        {res.status === 'arrived' && <div className="bg-emerald-200 dark:bg-emerald-900/80 text-emerald-800 dark:text-emerald-300 px-2 py-0.5 rounded text-xs font-bold flex items-center gap-1"><CheckCircle size={14}/> Da</div>}
                                                        {res.status === 'cancelled' && <div className="bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-400 px-2 py-0.5 rounded text-xs font-bold flex items-center gap-1"><X size={14}/> Storno</div>}
                                                        {res.status === 'no-show' && <div className="bg-red-600 text-white px-2 py-0.5 rounded text-xs font-bold flex items-center gap-1"><UserX size={14}/> NO-SHOW</div>}
                                                    </div>
                                                </div>
                                                <div className={`hidden md:flex col-span-1 font-bold items-center gap-1 py-1 ${isDarkMode ? 'text-stone-200' : 'text-stone-800'}`}><Clock size={14} className={theme.textMuted} />{res.time}</div>
                                                <div className={`hidden md:flex col-span-4 font-medium py-1 items-center gap-2 ${(res.status === 'cancelled' || res.status === 'no-show') ? 'line-through text-stone-500' : (isDarkMode ? 'text-stone-100' : 'text-stone-900')}`}>
                                                    <div className="hover:text-amber-600 transition-colors truncate">{res.name}</div>
                                                    {res.status === 'confirmed' && delayStatus === 'red' && <div className="w-2 h-2 rounded-full bg-red-500 animate-blink shadow-[0_0_6px_rgba(239,68,68,0.8)]" title="> 15 Min verspätet"></div>}
                                                    {res.status === 'confirmed' && delayStatus === 'yellow' && <div className="w-2 h-2 rounded-full bg-amber-400 animate-blink shadow-[0_0_6px_rgba(251,191,36,0.8)]" title="> 10 Min verspätet"></div>}
                                                    {res.status === 'arrived' && <span className="bg-emerald-200 dark:bg-emerald-900/80 text-emerald-800 dark:text-emerald-300 px-1.5 py-0.5 rounded text-[10px] font-bold">DA</span>}
                                                    {res.status === 'cancelled' && <span className="bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-400 px-1.5 py-0.5 rounded text-[10px] font-bold">STORNO</span>}
                                                    {res.status === 'no-show' && <span className="bg-red-600 text-white px-1.5 py-0.5 rounded text-[10px] font-bold tracking-wider">NO-SHOW</span>}
                                                </div>
                                                <div className="flex flex-wrap gap-2 md:hidden items-center leading-tight">
                                                    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-base font-bold ${isDarkMode ? 'bg-stone-700 text-stone-300' : 'bg-stone-100 text-stone-600'}`}><Users size={16}/> {res.pax}</span>
                                                    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-base font-mono ${isDarkMode ? 'bg-stone-700 text-stone-300' : 'bg-stone-100 text-stone-600'}`}>{res.table || 'Kein Tisch'}</span>
                                                </div>
                                                <div className="hidden md:block col-span-1 text-center py-1"><span className={`inline-flex items-center justify-center px-2 py-1 rounded-md text-sm font-bold w-10 ${isDarkMode ? 'bg-stone-700 text-stone-300' : 'bg-stone-100 text-stone-600'}`}>{res.pax}</span></div>
                                                <div className={`hidden md:block col-span-1 text-center font-mono text-sm py-1 ${isDarkMode ? 'text-stone-400' : 'text-stone-600'}`}>{res.table || '-'}</div>
                                                <div className="md:col-span-3 flex flex-col justify-center">{renderNoteContent(res.notes)}{res.createdBy && editingId === res.id && <div className="text-[10px] text-amber-600 mt-1">Erstellt von: {res.createdBy}</div>}</div>
                                                {currentUser.role !== 'chef' && <div className="flex md:col-span-2 md:justify-end gap-2 py-0.5 mt-1 border-t pt-1 md:border-0 md:pt-0 border-dashed border-stone-200 dark:border-stone-700" onClick={(e) => e.stopPropagation()}>
                                                    {res.status === 'confirmed' && <button onClick={() => updateStatus(res.id, 'arrived')} className={`flex-1 md:flex-none justify-center py-2 px-2 md:p-1.5 rounded border transition-all duration-200 active:scale-90 tooltip flex items-center gap-1.5 md:gap-0 ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-500 hover:bg-emerald-900/30 hover:text-emerald-400 hover:border-emerald-800' : 'bg-white border-stone-200 text-stone-400 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200'}`} title="Gast ist da"><Users size={16} className="md:w-4 md:h-4" /><span className="md:hidden text-xs font-medium">Anwesend</span></button>}
                                                    
                                                    <button onClick={() => openEditModal(res)} className={`hidden md:flex justify-center py-2 px-2 md:p-1.5 rounded border transition-all duration-200 active:scale-90 items-center ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-500 hover:bg-stone-700 hover:text-stone-300 hover:border-stone-500' : 'bg-white border-stone-200 text-stone-400 hover:bg-stone-50 hover:text-stone-600 hover:border-stone-300'}`} title="Bearbeiten"><Edit2 size={16} className="w-4 h-4" /></button>
                                                    
                                                    {res.status === 'confirmed' && <button onClick={() => updateStatus(res.id, 'cancelled')} className={`flex-1 md:flex-none justify-center py-2 px-2 md:p-1.5 rounded border transition-all duration-200 active:scale-90 flex items-center gap-1.5 md:gap-0 ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-500 hover:bg-stone-700/50 hover:text-stone-400' : 'bg-white border-stone-200 text-stone-400 hover:bg-stone-100 hover:text-stone-600'}`} title="Normales Storno (Hat abgesagt)"><X size={16} className="md:w-4 md:h-4" /><span className="md:hidden text-xs font-medium">Storno</span></button>}
                                                    {res.status === 'confirmed' && <button onClick={() => updateStatus(res.id, 'no-show')} className={`flex-1 md:flex-none justify-center py-2 px-2 md:p-1.5 rounded border transition-all duration-200 active:scale-90 flex items-center gap-1.5 md:gap-0 ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-500 hover:bg-red-900/50 hover:text-red-400 hover:border-red-700' : 'bg-white border-stone-200 text-stone-400 hover:bg-red-50 hover:text-red-600 hover:border-red-300'}`} title="Gast nicht erschienen (Blacklist-Eintrag)"><UserX size={16} className="md:w-4 md:h-4" /><span className="md:hidden text-xs font-medium">No-Show</span></button>}
                                                    {(res.status === 'cancelled' || res.status === 'arrived' || res.status === 'no-show') && (<button onClick={(e) => { e.stopPropagation(); updateStatus(res.id, 'confirmed'); }} className={`flex-1 md:flex-none justify-center py-2 px-2 md:p-1.5 rounded border transition-all duration-200 active:scale-90 flex items-center gap-1.5 md:gap-0 ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-500 hover:bg-blue-900/30 hover:text-blue-400 hover:border-blue-800' : 'bg-white border-stone-200 text-stone-400 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200'}`} title="Wiederherstellen"><RotateCcw size={16} className="md:w-4 md:h-4" /><span className="md:hidden text-xs font-medium">Wiederherstellen</span></button>)}
                                                </div>}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </main>

                    {showCalendar && (<CustomCalendar currentDate={currentDate} onDateSelect={(d) => { setCurrentDate(d); }} onClose={() => setShowCalendar(false)} reservations={reservations} theme={theme} isDarkMode={isDarkMode} />)}

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto pt-20 pb-20">
                            <div className={`rounded-2xl shadow-xl w-full max-w-lg overflow-hidden animate-spring ${theme.card} my-auto`}>
                                <div className="bg-amber-600 px-6 py-4 flex justify-between items-center"><h2 className="text-white font-bold text-lg flex items-center gap-2">{editingId ? <Edit2 size={20}/> : <Plus size={20}/>} {editingId ? 'Reservierung bearbeiten' : 'Neue Reservierung'}</h2><button onClick={closeModal} className="text-amber-100 hover:text-white transition-transform active:scale-90"><X size={24}/></button></div>
                                <form onSubmit={handleSubmit} className="p-6">
                                    <div className="grid grid-cols-2 gap-3 md:gap-4">
                                        
                                        {/* NO-SHOW FRÜHWARNUNG */}
                                        {pastNoShows.length > 0 && (
                                            <div className="col-span-2 bg-red-100 border-l-4 border-red-500 text-red-800 p-3 rounded-lg flex flex-col gap-2 mb-2 animate-spring shadow-sm">
                                                <div className="flex items-start gap-2 cursor-pointer" onClick={() => setShowNoShowDetails(!showNoShowDetails)}>
                                                    <AlertCircle size={20} className="shrink-0 mt-0.5 text-red-600" />
                                                    <div className="flex-1">
                                                        <strong className="block text-sm uppercase tracking-wide">Blacklist Warnung! ({pastNoShows.length}x)</strong>
                                                        <span className="text-xs block mt-0.5">Dieser Gast ist in der Vergangenheit nicht erschienen (No-Show). <span className="underline font-bold">Klicken für Details</span></span>
                                                    </div>
                                                    <ChevronDown size={16} className={`transform transition-transform mt-0.5 text-red-600 ${showNoShowDetails ? 'rotate-180' : ''}`} />
                                                </div>
                                                {showNoShowDetails && (
                                                    <div className="mt-1 pl-7 text-xs border-t border-red-200 pt-2 space-y-1.5">
                                                        {pastNoShows.map(ns => (
                                                            <div key={ns.id} className="flex items-center gap-2">
                                                                <span className="font-bold">&bull; {formatDateDE(new Date(ns.date))}</span>
                                                                <span>um {ns.time} Uhr</span>
