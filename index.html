                                                                <span className="opacity-75">({ns.pax} Personen)</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* 1. KONTAKTDATEN GANZ OBEN */}
                                        <div className="col-span-2 flex gap-2">
                                            <div className="w-1/2 min-w-0">
                                                <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Telefon</label>
                                                <input type="tel" name="phone" value={formData.phone} onChange={handleInputChange} placeholder="017..." className={`w-full min-w-0 rounded-lg border px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none ${theme.input}`} autoFocus />
                                            </div>
                                            <div className="w-1/2 min-w-0">
                                                <label className={`block text-sm font-medium mb-1 flex items-center gap-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Insta (@)</label>
                                                <input type="text" name="instagram" value={formData.instagram} onChange={handleInputChange} placeholder="mabelle..." className={`w-full min-w-0 rounded-lg border px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none ${theme.input}`} />
                                            </div>
                                        </div>

                                        {/* 2. NAME (Wird erst angezeigt, wenn Kontaktinfo Mindestlänge hat) */}
                                        {((formData.phone || '').replace(/[\s\-\+\/]/g, '').length >= 8 || (formData.instagram || '').replace(/^@/, '').trim().length >= 5) && (
                                            <div className="col-span-2 animate-slide-fade">
                                                <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Name des Gastes</label>
                                                <input required name="name" value={formData.name} onChange={handleInputChange} type="text" className={`w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none ${theme.input}`} placeholder="z.B. Max Mustermann" />
                                            </div>
                                        )}

                                        <div className="col-span-2 flex gap-2">
                                            <div className="w-1/2 min-w-0"><label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Uhrzeit</label><div className={`flex items-center w-full rounded-lg border px-1 py-2 focus-within:ring-2 focus-within:ring-amber-500 ${theme.input}`}><select value={formData.time.split(':')[0]} onChange={(e) => handleTimeChange('h', e.target.value)} className="w-1/2 text-center bg-transparent border-0 outline-none appearance-none time-select cursor-pointer">{hoursList.map(h => <option key={h} value={h} className={isDarkMode ? 'bg-stone-800' : 'bg-white'}>{h}</option>)}</select><span className="font-bold opacity-50 px-1">:</span><select value={formData.time.split(':')[1]} onChange={(e) => handleTimeChange('m', e.target.value)} className="w-1/2 text-center bg-transparent border-0 outline-none appearance-none time-select cursor-pointer">{minutesList.map(m => <option key={m} value={m} className={isDarkMode ? 'bg-stone-800' : 'bg-white'}>{m}</option>)}</select></div></div>
                                            <div className="w-1/2 min-w-0"><label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Personen</label><div className="flex items-center w-full"><button type="button" onClick={() => setFormData(p => ({...p, pax: Math.max(1, parseInt(p.pax)-1)}))} className={`w-14 h-10 text-xl rounded-l-lg font-bold border-y border-l transition-colors active:bg-stone-300 dark:active:bg-stone-500 ${isDarkMode ? 'bg-stone-700 border-stone-600 text-stone-300 hover:bg-stone-600' : 'bg-stone-100 border-stone-200 text-stone-600 hover:bg-stone-200'}`}>-</button><input type="number" name="pax" value={formData.pax} onChange={handleInputChange} className={`w-full min-w-0 text-center border-y h-10 font-bold text-lg outline-none ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-100' : 'bg-white border-stone-200'}`} /><button type="button" onClick={() => setFormData(p => ({...p, pax: parseInt(p.pax)+1}))} className={`w-14 h-10 text-xl rounded-r-lg font-bold border-y border-r transition-colors active:bg-stone-300 dark:active:bg-stone-500 ${isDarkMode ? 'bg-stone-700 border-stone-600 text-stone-300 hover:bg-stone-600' : 'bg-stone-100 border-stone-200 text-stone-600 hover:bg-stone-200'}`}>+</button></div></div></div>
                                        
                                        <div className="col-span-2">
                                            <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Tisch</label>
                                            <div className="flex relative">
                                                <input type="text" name="table" value={formData.table} onChange={handleInputChange} placeholder="z.B. T12" className={`w-full min-w-0 rounded-lg border px-3 py-2 pr-10 focus:ring-2 focus:ring-amber-500 outline-none ${theme.input}`} />
                                                <button type="button" onClick={() => openTableSelector()} className={`absolute right-1 top-1 p-1.5 rounded hover:bg-stone-200 dark:hover:bg-stone-700 text-amber-600 transition-colors`}><Square size={18}/></button>
                                            </div>
                                        </div>
                                        
                                        <div className="col-span-2">
                                            <label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Datum (Verschieben)</label>
                                            <div className={`flex items-center rounded-lg border px-1 py-1 shadow-sm transition-colors ${theme.input}`}>
                                                <button type="button" onClick={handleModalPrevDay} className={`p-2 rounded-md transition-all ${isDarkMode ? 'hover:bg-stone-700 text-stone-400' : 'hover:bg-stone-100 text-stone-500'} hover:text-amber-600`}><ChevronLeft size={20} /></button>
                                                <div className={`relative flex-1 flex items-center justify-center gap-2 cursor-pointer font-medium ${isDarkMode ? 'text-stone-200' : 'text-stone-700'}`}>
                                                    <CalendarIcon size={16} className="text-amber-600 shrink-0" />
                                                    <span className="pointer-events-none select-none text-base whitespace-nowrap">{formatModalDate(formData.date)}</span>
                                                    <input type="date" name="date" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" value={formData.date} onChange={handleInputChange} />
                                                </div>
                                                <button type="button" onClick={handleModalNextDay} className={`p-2 rounded-md transition-all ${isDarkMode ? 'hover:bg-stone-700 text-stone-400' : 'hover:bg-stone-100 text-stone-500'} hover:text-amber-600`}><ChevronRight size={20} /></button>
                                            </div>
                                        </div>

                                        <div className="col-span-2"><label className={`block text-sm font-medium mb-2 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Schnellnotiz (Klicken zum Einfügen)</label><div className="flex gap-2">{availableTags.map(tag => { const isActive = (formData.notes || '').includes(tag.label); const TagIcon = tag.icon; return (<button key={tag.id} type="button" onClick={() => toggleTag(tag.label)} className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-sm font-medium transition-all ${isActive ? `${tag.color} ring-2 ring-offset-1 ring-amber-500/50` : `bg-transparent border-dashed ${isDarkMode ? 'border-stone-600 text-stone-400 hover:bg-stone-800' : 'border-stone-300 text-stone-500 hover:bg-stone-50'}`}`}><TagIcon size={16} /> {tag.label}</button>); })}</div></div>
                                        <div className="col-span-2"><label className={`block text-sm font-medium mb-1 ${isDarkMode ? 'text-stone-300' : 'text-stone-700'}`}>Notizen</label><textarea name="notes" value={formData.notes} onChange={handleInputChange} rows="3" className={`w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none resize-none ${theme.input}`} placeholder="Weitere Details hier eingeben..."></textarea></div>
                                    </div>
                                    {editingId && (() => {
                                        const res = reservations.find(r => r.id === editingId);
                                        if (!res) return null;
                                        return (
                                            <div className="mt-4 pt-4 border-t border-stone-200 dark:border-stone-700 text-xs text-stone-500 space-y-1">
                                                <div className="flex justify-between"><span>Erstellt: <strong>{res.createdBy}</strong></span><span>{formatDateTime(res.createdAt)}</span></div>
                                                {res.updatedBy && <div className="flex justify-between text-amber-600"><span>Geändert: <strong>{res.updatedBy}</strong></span><span>{formatDateTime(res.updatedAt)}</span></div>}
                                            </div>
                                        );
                                    })()}
                                    <div className="mt-8 flex gap-3 justify-end"><button type="button" onClick={closeModal} className={`px-5 py-2 rounded-lg transition-all active:scale-95 ${isDarkMode ? 'text-stone-400 hover:bg-stone-700' : 'text-stone-600 hover:bg-stone-100'}`}>Abbrechen</button><button type="submit" className="px-5 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 shadow-md transition-all active:scale-95 font-medium">{editingId ? 'Änderungen speichern' : 'Reservierung hinzufügen'}</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    {/* TABLE SELECTOR OVERLAY */}
                    {showTableSelector && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col">
                            <div className="p-4 flex justify-between items-center text-white bg-stone-900 border-b border-stone-800 animate-dropdown">
                                <h2 className="text-lg font-bold flex items-center gap-2"><Square/> Tisch auswählen</h2>
                                <div className="flex gap-3 items-center">
                                    <button onClick={confirmTableSelection} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 transition-transform active:scale-95"><Check size={16}/> Übernehmen</button>
                                    <button onClick={() => setShowTableSelector(false)} className="p-2 bg-stone-800 rounded-full hover:bg-stone-700 transition-transform active:scale-90"><X/></button>
                                </div>
                            </div>
                            <div className="flex-1 overflow-auto p-4 bg-stone-900 relative">
                                <div className={`relative w-full h-[500px] md:h-[700px] border-2 border-stone-700 rounded-lg overflow-hidden grid-bg bg-stone-800`}>
                                    <MapRenderer tables={tableLayout} onTableClick={(e, id) => { 
                                        e.preventDefault(); 
                                        const clickedTable = tableLayout.find(t => t.id === id);
                                        if(clickedTable && clickedTable.type === 'table') toggleTableSelection(clickedTable.label);
                                    }} selectedTableId={null} isEditor={false} />
                                    
                                     <div style={{ position: 'absolute', top: 0, left: 0, width: '1000px', height: '800px', pointerEvents: 'none' }}>
                                        {tableLayout.map(t => {
                                            if (tempSelectedTables.includes(t.label)) {
                                                return (
                                                    <div key={t.id} style={{ 
                                                        position: 'absolute', 
                                                        left: `${t.x}%`, top: `${t.y}%`, width: `${t.w}px`, height: `${t.h}px`, 
                                                        transform: `translate(-50%, -50%) rotate(${t.rotation || 0}deg)`,
                                                        border: '4px solid #f59e0b', borderRadius: t.subtype === 'round' ? '50%' : '4px', zIndex: 100 
                                                    }}/>
                                                )
                                            }
                                            return null;
                                        })}
                                     </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 8. APP WRAPPER & INIT ---
        const App = () => {
            // --- 1. LOKALE SPEICHER-CHECKS (Für Schnellstart) ---
            const [bioData, setBioData] = useState(() => {
                try {
                    const stored = localStorage.getItem('mabelle_biometric');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Date.now() > parsed.expires) {
                            localStorage.removeItem('mabelle_biometric');
                            return null;
                        }
                        return parsed;
                    }
                } catch(e) {}
                return null;
            });

            const [isSharedDevice, setIsSharedDevice] = useState(() => {
                return localStorage.getItem('mabelle_shared_device') === 'true';
            });

            // 2. Start-Ansicht berechnen: Direkt zum Login, wenn Face-ID oder Kassen-Tablet aktiv ist!
            const [view, setView] = useState((bioData || isSharedDevice) ? 'login' : 'landing'); 

            const [currentUser, setCurrentUser] = useState(null);
            const [employees, setEmployees] = useState([]);
            const [reservations, setReservations] = useState([]);
            const [tableLayout, setTableLayout] = useState([]); 
            const [pacingSettings, setPacingSettings] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const stored = localStorage.getItem('mabelle_darkmode');
                return stored ? JSON.parse(stored) : false;
            });
            useEffect(() => localStorage.setItem('mabelle_darkmode', isDarkMode), [isDarkMode]);

            const [pinInput, setPinInput] = useState('');
            const [loginError, setLoginError] = useState(false);
            
            // --- SICHERHEITS-STATES FÜR LOCKOUT ---
            const [failedAttempts, setFailedAttempts] = useState(0);
            const [lockoutTime, setLockoutTime] = useState(0);
            
            const [pendingUser, setPendingUser] = useState(null);
            const [showBiometricSetup, setShowBiometricSetup] = useState(false);

            // --- MANUELLE & AUTO-SYNC LOGIK ---
            const [isSyncing, setIsSyncing] = useState(false);
            
            // --- AUTO-SCAN STATE ---
            const [autoScanTriggered, setAutoScanTriggered] = useState(false);

            const forceSync = async () => {
                if (isSyncing) return;
                setIsSyncing(true);
                try {
                    // Startet die Datenbankverbindung hart neu, um feststeckende Caches zu lösen
                    await db.disableNetwork();
                    await db.enableNetwork();
                } catch (e) { 
                    console.error("Sync Error", e); 
                }
                setTimeout(() => setIsSyncing(false), 800); // 800ms Lade-Animation
            };

            // Auto-Sync wenn Tablet aufwacht (Bildschirm an oder Tab geöffnet)
            useEffect(() => {
                const handleVisibility = () => {
                    if (document.visibilityState === 'visible') forceSync();
                };
                const handleFocus = () => forceSync();

                document.addEventListener("visibilitychange", handleVisibility);
                window.addEventListener("focus", handleFocus);
                
                return () => {
                    document.removeEventListener("visibilitychange", handleVisibility);
                    window.removeEventListener("focus", handleFocus);
                };
            }, []);
            // ----------------------------------------

            const toggleSharedDevice = () => {
                const newValue = !isSharedDevice;
                setIsSharedDevice(newValue);
                localStorage.setItem('mabelle_shared_device', newValue);
                if (newValue) {
                    // Lösche evtl. vorhandene Face-ID Verknüpfungen von diesem Kassen-Tablet
                    localStorage.removeItem('mabelle_biometric');
                    setBioData(null);
                }
            };

            const toggleDarkMode = () => setIsDarkMode(!isDarkMode);

            useEffect(() => {
                auth.signInAnonymously().then(() => {
                    db.collection("employees").onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setEmployees(data);
                        if (data.length === 0) db.collection("employees").add({ name: 'Chef', pin: '9999', role: 'admin' });
                    });
                    
                    db.collection("reservations").onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setReservations(data);
                    });
                    
                    db.collection("settings").doc("pacing").onSnapshot((doc) => {
                        if (doc.exists) setPacingSettings(doc.data());
                    });

                    const localTables = localStorage.getItem('mabelle_tables_autosave');
                    if (localTables) setTableLayout(JSON.parse(localTables));
                    
                    db.collection("settings").doc("tables").onSnapshot((doc) => {
                        if (doc.exists) setTableLayout(doc.data().layout || []);
                    });
                    
                    setIsLoading(false);
                }).catch((error) => { console.error("Auth Error", error); setIsLoading(false); });
            }, []);

            // --- TIMER FÜR SPERR-COUNTDOWN ---
            useEffect(() => {
                let timer;
                if (lockoutTime > 0) {
                    timer = setInterval(() => {
                        setLockoutTime(prev => prev - 1);
                    }, 1000);
                } else if (lockoutTime === 0 && failedAttempts >= 3) {
                    setFailedAttempts(0);
                }
                return () => clearInterval(timer);
            }, [lockoutTime, failedAttempts]);

            // --- LOGIN LOGIK MIT BIOMETRIE-PFLICHT ---
            useEffect(() => {
                if (pinInput.length === 4) {
                    const user = employees.find(emp => emp.pin === pinInput);
                    if (user) { 
                        // Wenn der Browser WebAuthn unterstützt, MUSS der Nutzer es einrichten
                        // (es sei denn, dieses Gerät ist als "Laden-Tablet" markiert)
                        if (window.PublicKeyCredential && !bioData && !isSharedDevice) {
                            
                            // NEU: Single-Device-Sperre checken!
                            // Wenn der Nutzer schon ein verknüpftes Handy hat und NICHT der Admin ist, blockieren.
                            if (user.hasBiometric && user.role !== 'admin') {
                                alert(`Sicherheitssperre: Ihr Profil (${user.name}) ist bereits fest mit einem anderen Gerät verknüpft.\n\nBitte wenden Sie sich an einen Admin, um Ihr altes Gerät zu trennen, bevor Sie ein neues einrichten.`);
                                setPinInput('');
                                setLoginError(true);
                                setTimeout(() => { setPinInput(''); setLoginError(false); }, 600);
                                return;
                            }
                            
                            setPinInput(''); 
                            setLoginError(false); 
                            setFailedAttempts(0); 
                            setPendingUser(user);
                            setShowBiometricSetup(true);
                        } else {
                            setPinInput(''); 
                            setLoginError(false); 
                            setFailedAttempts(0); 
                            doLogin(user);
                        }
                    } else { 
                        setLoginError(true); 
                        const newAttempts = failedAttempts + 1;
                        setFailedAttempts(newAttempts);
                        if (newAttempts >= 3) setLockoutTime(30);
                        setTimeout(() => { setPinInput(''); setLoginError(false); }, 600); 
                    }
                }
            }, [pinInput, employees, failedAttempts, bioData]);

            const doLogin = (user) => {
                setCurrentUser(user);
                setPendingUser(null);
                setShowBiometricSetup(false);
                setView('book');
            };

            const handleLogout = () => { setCurrentUser(null); setView('landing'); };
            const handleNumpadClick = (num) => { 
                if (lockoutTime > 0) return; 
                if (pinInput.length < 4) setPinInput(prev => prev + num); 
            };

            // --- WEBAUTHN REGISTRIERUNG ---
            const registerBiometrics = async () => {
                try {
                    const randomId = new Uint8Array(16); window.crypto.getRandomValues(randomId);
                    const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                    
                    // Domain-Erkennung für Apple optimiert
                    const hostname = window.location.hostname;
                    const rpConfig = { name: "MABELLE Booking" };
                    if (hostname !== 'localhost' && !hostname.match(/^\d/)) {
                        rpConfig.id = hostname;
                    }
                    
                    const credential = await navigator.credentials.create({
                        publicKey: {
                            // WICHTIG: .buffer für strenge Apple-Geräte
                            challenge: challenge.buffer, 
                            rp: rpConfig,
                            user: { 
                                id: randomId.buffer, // WICHTIG: .buffer für strenge Apple-Geräte
                                name: pendingUser.name, 
                                displayName: pendingUser.name 
                            },
                            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
                            authenticatorSelection: { 
                                userVerification: "required" 
                            },
                            timeout: 60000
                        }
                    });

                    if(credential) {
                        const credId = bufferToBase64url(credential.rawId);
                        const newBioData = { empId: pendingUser.id, credId, expires: Date.now() + (30 * 24 * 60 * 60 * 1000) };
                        localStorage.setItem('mabelle_biometric', JSON.stringify(newBioData));
                        setBioData(newBioData);
                        
                        // NEU: Dem System (Firestore) mitteilen, dass der Nutzer jetzt verknüpft ist!
                        await db.collection("employees").doc(pendingUser.id).update({ hasBiometric: true });
                        
                        doLogin(pendingUser);
                    }
                } catch (e) {
                    console.error("Biometrie Fehler:", e);
                    alert("Sicherheits-Scan fehlgeschlagen:\n" + e.message);
                }
            };

            // --- WEBAUTHN LOGIN ---
            const loginBiometrics = async (isAuto = false) => {
                try {
                    const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                    
                    const hostname = window.location.hostname;
                    const rpId = (hostname !== 'localhost' && !hostname.match(/^\d/)) ? hostname : undefined;

                    await navigator.credentials.get({
                        publicKey: {
                            challenge: challenge.buffer, // WICHTIG: .buffer
                            rpId: rpId,
                            allowCredentials: [{ type: "public-key", id: base64urlToBuffer(bioData.credId) }],
                            userVerification: "required",
                            timeout: 60000
                        }
                    });
                    
                    const user = employees.find(e => e.id === bioData.empId);
                    if (user) {
                        doLogin(user);
                    } else {
                        alert("Benutzerprofil nicht gefunden.");
                        localStorage.removeItem('mabelle_biometric');
                        setBioData(null);
                    }
                } catch (e) {
                    console.error("Biometrie Fehler:", e);
                    // Wenn es der Auto-Scan war, nerven wir den Nutzer nicht mit einem Alert, 
                    // sondern lassen ihn einfach auf den Button klicken für einen neuen Versuch.
                    if (!isAuto) {
                        alert("Login per Scan fehlgeschlagen. Bitte versuchen Sie es erneut.");
                    }
                }
            };

            // --- AUTO-TRIGGER LOGIK ---
            useEffect(() => {
                if (view !== 'login') {
                    setAutoScanTriggered(false); // Reset, wenn wir die Login-Ansicht verlassen
                }
            }, [view]);

            useEffect(() => {
                // Wenn wir auf der Login-Seite sind, ein Token existiert und wir noch keinen Auto-Scan probiert haben:
                if (view === 'login' && bioData && !showBiometricSetup && !isSharedDevice && !autoScanTriggered) {
                    setAutoScanTriggered(true);
                    // 300ms Verzögerung, damit die Benutzeroberfläche erst sanft laden kann
                    setTimeout(() => {
                        loginBiometrics(true);
                    }, 300);
                }
            }, [view, bioData, showBiometricSetup, isSharedDevice, autoScanTriggered]);

            useEffect(() => {
                if (!currentUser) return; 
                let timeoutId;
                const resetTimer = () => { clearTimeout(timeoutId); timeoutId = setTimeout(() => { handleLogout(); }, 300000); };
                const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'];
                events.forEach(event => document.addEventListener(event, resetTimer));
                resetTimer();
                return () => { clearTimeout(timeoutId); events.forEach(event => document.removeEventListener(event, resetTimer)); };
            }, [currentUser]);

            const theme = {
                bg: isDarkMode ? 'bg-stone-900' : 'bg-stone-100', text: isDarkMode ? 'text-stone-100' : 'text-stone-800', textMuted: isDarkMode ? 'text-stone-400' : 'text-stone-500', card: isDarkMode ? 'bg-stone-800 border-stone-700' : 'bg-white border-stone-200', header: isDarkMode ? 'bg-stone-800 border-stone-700' : 'bg-white border-stone-200', input: isDarkMode ? 'bg-stone-900 border-stone-700 text-stone-100 focus:ring-amber-500' : 'bg-white border-stone-200 text-stone-800 focus:ring-amber-500', hover: isDarkMode ? 'hover:bg-stone-700' : 'hover:bg-stone-100', tableHeader: isDarkMode ? 'bg-stone-900 text-stone-400 border-stone-700' : 'bg-stone-50 text-stone-500 border-stone-200', rowHover: isDarkMode ? 'hover:bg-amber-900/20' : 'hover:bg-amber-50/30', navBg: isDarkMode ? 'bg-stone-900 border-stone-700' : 'bg-stone-50 border-stone-200', tag: (color) => isDarkMode ? 'bg-opacity-20 border-opacity-20' : ''
            };

            if (isLoading) return <div className={`min-h-screen flex items-center justify-center ${theme.bg} ${theme.text}`}>Lade...</div>;
            
            if (view === 'landing') {
                return (
                <div className={`min-h-screen flex flex-col items-center justify-center cursor-pointer transition-colors duration-500 ${theme.bg}`} onClick={() => setView('login')}>
                    <div className="text-center animate-in fade-in zoom-in duration-700"><div className="bg-amber-600 p-4 rounded-2xl text-white inline-block mb-6 shadow-xl"><Coffee size={48} /></div><h1 className={`text-5xl md:text-7xl font-mabelle tracking-widest uppercase mb-2 ${isDarkMode ? 'text-stone-100' : 'text-stone-900'}`}>MABELLE</h1><span className="text-amber-600 font-sans text-sm md:text-base font-bold uppercase tracking-[0.4em]">Reservierungen</span><p className={`mt-12 text-sm animate-pulse ${theme.textMuted}`}>Zum Starten tippen</p></div>
                </div>
                );
            }
            
            if (view === 'login') {
                // FALL 1: 30-Tage Token existiert auf diesem Gerät (und es ist kein Shared Device)
                if (bioData && !showBiometricSetup && !isSharedDevice) {
                    const knownUser = employees.find(e => e.id === bioData.empId);
                    return (
                        <div className={`min-h-screen flex flex-col items-center justify-center p-4 ${theme.bg}`}>
                            <div className={`w-full max-w-sm p-8 rounded-2xl shadow-xl transition-all duration-300 text-center ${theme.card}`}>
                                <div className="mx-auto bg-amber-100 dark:bg-amber-900/40 text-amber-600 w-20 h-20 flex items-center justify-center rounded-full mb-6">
                                    <ScanFace size={40} />
                                </div>
                                {/* NEU: Namens-Anzeige vereinfacht */}
                                <h2 className={`text-2xl font-bold mb-8 ${theme.text}`}>Willkommen {knownUser ? knownUser.name : ''}</h2>
                                
                                <button onClick={loginBiometrics} className="w-full py-4 bg-amber-600 text-white rounded-xl font-bold text-lg hover:bg-amber-700 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2">
                                    <ScanFace size={24} /> Mit Face-ID / Scan anmelden
                                </button>
                                {/* NEU: Der "Anderer Mitarbeiter"-Button wurde restlos entfernt */}
                            </div>
                        </div>
                    );
                }

                // FALL 2: Pflicht-Registrierung nach PIN-Eingabe
                if (showBiometricSetup && pendingUser) {
                    const isAdmin = pendingUser.role === 'admin';
                    return (
                        <div className={`min-h-screen flex flex-col items-center justify-center p-4 ${theme.bg}`}>
                            <div className={`w-full max-w-sm p-8 rounded-2xl shadow-xl transition-all duration-300 text-center border-2 ${isAdmin ? 'border-blue-500' : 'border-amber-500'} ${theme.card}`}>
                                <Shield size={48} className={`${isAdmin ? 'text-blue-500' : 'text-amber-500'} mx-auto mb-4 animate-bounce`} />
                                <h2 className={`text-2xl font-bold mb-2 ${theme.text}`}>{isAdmin ? 'Admin Zugang' : 'Sicherheit geht vor'}</h2>
                                <p className={`mb-6 text-sm ${theme.textMuted}`}>
                                    {isAdmin 
                                        ? `Als Admin können Sie Ihr Gerät verknüpfen oder diesen Schritt einfach überspringen.`
                                        : `Um PIN-Weitergabe zu verhindern, müssen Sie Ihr Profil (${pendingUser.name}) nun mit diesem Gerät verknüpfen.`}
                                </p>
                                
                                {!isAdmin && (
                                    <div className={`p-4 rounded-xl mb-6 text-sm text-left ${isDarkMode ? 'bg-stone-900' : 'bg-stone-100'}`}>
                                        <ul className="space-y-2">
                                            <li className="flex items-center gap-2"><CheckCircle size={16} className="text-emerald-500"/> Nur noch per Face-ID / Daumen einloggen</li>
                                            <li className="flex items-center gap-2"><CheckCircle size={16} className="text-emerald-500"/> PIN-Eingabe entfällt für 30 Tage</li>
                                            <li className="flex items-center gap-2"><CheckCircle size={16} className="text-emerald-500"/> Fremdzugriff unmöglich</li>
                                        </ul>
                                    </div>
                                )}

                                <button onClick={registerBiometrics} className={`w-full py-4 text-white rounded-xl font-bold active:scale-95 transition-all shadow-md flex justify-center items-center gap-2 mb-3 ${isAdmin ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                                    <ScanFace size={20} /> Jetzt Gerät verknüpfen
                                </button>
                                
                                {isAdmin ? (
                                    <button onClick={() => doLogin(pendingUser)} className={`w-full py-4 rounded-xl font-bold active:scale-95 transition-all shadow-sm border ${isDarkMode ? 'bg-stone-800 border-stone-600 text-stone-300 hover:bg-stone-700' : 'bg-white border-stone-300 text-stone-700 hover:bg-stone-50'}`}>
                                        Überspringen (Nur Admin)
                                    </button>
                                ) : (
                                    <button onClick={() => { setPendingUser(null); setShowBiometricSetup(false); }} className={`text-sm mt-3 underline ${theme.textMuted} hover:text-amber-600`}>
                                        Abbrechen & Zurück
                                    </button>
                                )}
                            </div>
                        </div>
                    );
                }

                // FALL 3: Klassische PIN Eingabe
                return (
                <div className={`min-h-screen flex flex-col items-center justify-center p-4 ${theme.bg}`}>
                    <div className={`w-full max-w-sm p-8 rounded-2xl shadow-xl transition-all duration-300 ${theme.card} ${lockoutTime > 0 ? 'border-2 border-red-500' : ''}`}>
                        <h2 className={`text-center text-2xl font-bold mb-6 ${theme.text}`}>Mitarbeiter Login</h2>
                        
                        {lockoutTime > 0 ? (
                            <div className="text-center mb-8 p-4 bg-red-100 dark:bg-red-950/50 text-red-700 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800 animate-spring">
                                <Lock size={32} className="mx-auto mb-2" />
                                <h3 className="font-bold text-lg mb-1">Zugang gesperrt</h3>
                                <p className="text-sm">Zu viele falsche Versuche. Bitte warten Sie <strong>{lockoutTime} Sekunden</strong>.</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-center gap-4 mb-8">{[0, 1, 2, 3].map(i => (<div key={i} className={`w-4 h-4 rounded-full border transition-all duration-200 ${pinInput.length > i ? 'bg-amber-600 border-amber-600 scale-110' : `border-stone-300 ${loginError ? 'border-red-500 bg-red-50' : ''}`}`}></div>))}</div>
                                {loginError && <p className="text-red-500 text-center text-sm mb-4 font-medium animate-pulse">Falsche PIN</p>}
                                <div className="grid grid-cols-3 gap-4 mb-6">{[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (<button key={num} onClick={() => handleNumpadClick(String(num))} className={`h-16 rounded-xl text-xl font-bold transition-all active:scale-95 ${isDarkMode ? 'bg-stone-700 text-stone-100 hover:bg-stone-600' : 'bg-stone-100 text-stone-800 hover:bg-stone-200'}`}>{num}</button>))}<div className="col-start-2"><button onClick={() => handleNumpadClick('0')} className={`w-full h-16 rounded-xl text-xl font-bold transition-all active:scale-95 ${isDarkMode ? 'bg-stone-700 text-stone-100 hover:bg-stone-600' : 'bg-stone-100 text-stone-800 hover:bg-stone-200'}`}>0</button></div><div><button onClick={() => { if(lockoutTime === 0) setPinInput(''); }} className={`w-full h-16 rounded-xl flex items-center justify-center text-red-500 hover:bg-red-50 transition-all ${isDarkMode ? 'hover:bg-stone-700' : ''}`}><X size={24} /></button></div></div>
                            </>
                        )}

                        <div className="flex flex-col gap-3"><button onClick={() => setView('landing')} className={`w-full py-3 rounded-xl font-medium transition-colors ${theme.textMuted} ${theme.hover}`}>Abbrechen</button></div>
                    </div>
                </div>
                );
            }
            if (view === 'admin') return <AdminView employees={employees} reservations={reservations} setView={setView} theme={theme} isDarkMode={isDarkMode} db={db} tableLayout={tableLayout} pacingSettings={pacingSettings} isSharedDevice={isSharedDevice} toggleSharedDevice={toggleSharedDevice} />;
            return <ReservationBook currentUser={currentUser} handleLogout={handleLogout} theme={theme} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} setView={setView} reservations={reservations} db={db} tableLayout={tableLayout} pacingSettings={pacingSettings} forceSync={forceSync} isSyncing={isSyncing} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
